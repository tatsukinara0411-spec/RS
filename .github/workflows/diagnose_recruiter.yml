name: 診断（採用担当者名の掲載率）

on:
  push:
    branches:
      - claude/recruiter-check
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: playwright install chromium --with-deps
      - run: python tools/diagnose_recruiter.py

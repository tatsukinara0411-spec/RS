name: debug-html-check

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install playwright pydantic

      - name: Install browser
        run: playwright install chromium --with-deps

      - name: Run debug
        run: python debug_scrape.py

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: debug_*.html
          retention-days: 1

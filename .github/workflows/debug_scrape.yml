name: デバッグ: HTML構造確認

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright pydantic

      - run: playwright install chromium --with-deps

      - name: HTML構造確認実行
        run: python debug_scrape.py

      - name: HTMLファイルをアーティファクトにアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: debug_*.html
          retention-days: 1
